[entry]
id = "COL-0028"
title = "Algebraic K₀ localization by a Serre class"
kind = "theorem"
section = "grothendieck-groups"
order = 110
statement = "The actual additive Serre localization map on algebraic K₀ is surjective, has kernel the subgroup generated by Serre object classes, and induces a generator-preserving quotient equivalence."
scope = "Abelian source and target categories with independent object and hom universes, a Serre class P, and an additive localization functor L at P.isoModSerre. The transported equivalence equals the actual quotient lift. Tag 02MX(1) is used through the pinned Stacks proof and the inclusion-image comparison; no claim about Tag 02MX(2), inclusion injectivity, or homotopy-theoretic K-groups is made. Source correspondence was checked against the cited clauses on 2026-11-05; this does not record independent mathematical review or compilation."
review = "author_checked"
