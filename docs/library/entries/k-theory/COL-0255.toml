[entry]
id = "COL-0255"
title = "Native Milnor K₂ symbols in the Steinberg kernel"
kind = "definition"
section = "milnor-k-theory"
order = 700
statement = "The canonical native Milnor K₂ map sends each ordered symbol {a,b} to the literal stable Steinberg kernel word h(a) h(b) h(ab)⁻¹. It commutes with actual field change and retains the positive rank-three commutator marking."
scope = "Every field, including characteristics two and three. The target is the central kernel of the proved surjective stable Steinberg-to-elementary map on native PresentedGroup and DirectLimit constructions. This is not yet a Quillen K₂ comparison or an assertion of bijectivity."
review = "author_checked"
