[chapter]
id = "topology"
title = "Topology"
order = 40
introduction = "Geometric realizations and based homotopy groups retain their actual spaces, points and universe bounds."

[[sections]]
id = "classifying-spaces"
title = "Classifying spaces"
order = 10
introduction = "The realized nerve of a category has a point for every object. Based homotopy groups provide the topological constructions later specialized to Quillen's Q-category."

[[sections]]
id = "homotopy-groups"
title = "Homotopy groups"
order = 20
introduction = "Pointed continuous maps act on actual generalized-loop homotopy quotients. Their group homomorphisms retain the existing multiplication and degree conventions."

[[sections]]
id = "geometric-realization"
title = "Geometric realization"
order = 30
introduction = "Coordinate comparisons retain the chosen realization, finite vertex sets, actual maps and interval orientation."

[[sections]]
id = "homotopy-colimits"
title = "Homotopy invariance of colimits"
order = 25
introduction = "Homotopy extension, mapping cylinders and coherent timed deformations retain the actual comparison maps of pushouts and sequential colimits. Chosen stagewise inverses need not be compatible. These generic results support the cellular realization comparison."
