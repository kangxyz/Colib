[entry]
id = "COL-0098"
title = "Explicit simplex boundary-cylinder retraction"
kind = "definition"
section = "geometric-realization"
order = 180
statement = "A continuous radial projection retracts the cylinder on a finite real standard simplex onto the union of its boundary cylinder and bottom face. The actual map lands in that subspace and fixes it pointwise."
scope = "The native function-subtype standard simplex has vertices Fin (n + 1), for every natural n including zero. The radial center is at height two over the barycenter. This adapts the disk-cylinder construction in the proof of Proposition 0.16, not its general CW-pair conclusion. The fixed subspace is the side and bottom, not the top face. This leaf supplies a retraction, not a separate deformation homotopy of the whole cylinder. In dimension zero the boundary is empty and the target is the bottom point; no separate zero-dimensional simplification theorem is asserted. No geometric-realization transport, general cofibration or homotopy extension theorem is included. Source correspondence was checked against the cited scope on 2026-11-05; this does not record independent mathematical review or compilation."
review = "author_checked"
