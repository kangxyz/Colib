statement = "A functor whose costructured comma categories have contractible classifying spaces induces a homotopy equivalence with exactly the actual realized functor as forward map. The dual structured-comma statement is also proved."
scope = "Small categories in one universe. Contractibility concerns the actual comma nerves; no replacement equivalence is assumed as input."
