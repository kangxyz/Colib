[chapter]
id = "k-theory"
title = "K-theory"
order = 10
introduction = "We develop additive invariants and the comparison maps used by algebraic K-theory. The current sections construct Grothendieck groups and Milnor K-theory using the selected Mathlib and Stacks objects. Quillen and Waldhausen constructions enter through their own exact and homotopical prerequisites."

[[sections]]
id = "grothendieck-groups"
title = "Grothendieck groups"
order = 10
introduction = "Begin with the presentation by objects and short exact sequences. Its additivity and functoriality lead to the dimension computation for finite-dimensional vector spaces. The object classes and their normalization are retained throughout. Exact-functor maps and the inclusion-image comparison lead to algebraic localization by a Serre class, including the actual canonical quotient."

[[sections]]
id = "milnor-k-theory"
title = "Milnor K-theory"
order = 20
introduction = "The canonical graded object is the Steinberg quotient of the tensor algebra on the multiplicative group of a field. We first construct its homogeneous groups, then compare the degree-two component with the ordered-pair presentation. Ordered tuple symbols then expose coordinate additivity and adjacent Steinberg and sign identities directly on those homogeneous groups. Direct split evaluation and native reduced representatives give finite signed mixed-symbol expansions in the same homogeneous group. Finite witnesses precede all coefficient fields and actual factors; over a perfect base, a prime-degree root-field class then acquires its expansion in the root field of the whole coefficient image after one actual finite coprime extension. Native weak degree bounds and the shifted former strict bounds remain distinct. The literature references identify the defining relations and the scope of each comparison. Canonical DVR residues extend to actual completion through the native fraction-field lift and residue-field identification, preserving and reflecting residue vanishing. The native Milnor K₂ map sends ordered symbols directly to actual stable Steinberg kernel words, preserving field maps and the positive commutator marking."

[[sections]]
id = "quillen-k-theory"
title = "Quillen K-theory"
order = 30
introduction = "Quillen K-groups are the shifted homotopy groups of the realized Q-category, based at the original zero vertex. The Q-classifying space BQ is distinguished from its loop space. The objectwise-finite Resolution theorem retains the canonical inclusion map in every degree. The canonical Grothendieck-to-Quillen K-zero map is a proved equivalence on the same actual homotopical K-zero. Classical devissage proves the actual inclusion equivalence from objectwise finite filtrations without extension closure. Quillen-Waldhausen comparisons remain separate results. Canonical Serre localization identifies the actual quotient homotopy fiber and yields the connective long exact sequence with its original inclusion, quotient and path-space boundary maps. In characteristic zero, the canonical Milnor K₂ maps to right-projective Quillen K₂ and upper finite-module SmallK₂ are equivalences, natural for the original field-extension maps in both directions. Ordered symbols have the original positive scalar unit product over every field; the negative normalization is minus the positive inverse."

[[sections]]
id = "waldhausen-k-theory"
title = "Waldhausen K-theory"
order = 40
introduction = "The current model realizes the unnormalized diagonal IsZero S-construction. Actual weak-row nerves and coherent weak-transformation cylinders retain its maps. The genuine simplicial composition triangle has those original cylinders as all three faces and fixes its entire zero-vertex triangle under explicit chosen-zero equalities. Image-zero homotopy-group maps precede explicit based maps; ordinary subdivision and the based three-stage deformation prove additivity for the original canonical KMap. The actual product comparison identifies this with the original group multiplication, which is commutative even in K-zero. Actual acyclic subcategories and relative quotient rows now give the fibration theorem for the original canonical path-space comparison under coarse two-out-of-three, extension, joint cylinder data and its second-endpoint section. The full nullhomotopy and distinct universes are retained. Approximation proves weak equivalence of the unchanged delooping and bijectivity of its canonical KMap in every nonnegative degree from exactness, App1/App2, target two-out-of-three and genuine source joint-cylinder data; no row-equivalence or homotopy-inverse premise is added. The actual connective change-of-weak long exact sequence retains its path-space boundary and K-zero tail. For termwise extension- and kernel-closed subcategories of an abelian category, native bounded-complex filtrations and the actual identity-cone cylinder prove Gillet-Waldhausen on the original degree-zero single KMap in every nonnegative degree. Dense cofinality constructs the actual complement grading and compares its coarse delooping with the nerve of its realized-value subgroup. The original full inclusion is an equivalence in positive K-degrees and injective in K-zero; its exact tail retains the actual coarse K-zero group. The original object-loop map now identifies the universal weak-arrow and pushout presentation with actual K-zero, without additional cylinder hypotheses. Under genuine target factorization, its naturality identifies the actual coarse K-zero obstruction with the quotient by the original exact-functor image and retains the unchanged changeWeak KMap. A strict chosen-zero model comparison remains a separate obligation."
