# Uses the native scopes, staging repair, batched lint and same-host handoff from
# kangxyz/aglib 1943d6e. Colib acquires Mathlib from its existing upstream cache.
name: Lean CI

on:
  workflow_call:
    inputs:
      package-directory:
        type: string
        default: .
      build-targets:
        type: string
        default: Colib
      runner-labels:
        type: string
        default: '["ubuntu-24.04"]'
      reuse-build-host:
        type: boolean
        default: false
      native-memory-mib:
        type: number
        default: 13824
      lake-threads:
        type: number
        default: 1
      lint-workers:
        type: number
        default: 2
      job-timeout-minutes:
        type: number
        default: 360
      build-job-timeout-minutes:
        type: number
        default: 0
      build-compiler-minutes:
        type: number
        default: 0

permissions:
  contents: read
  actions: read

env:
  LAKE_NO_CACHE: 'true'
  LAKE_ARTIFACT_CACHE: 'true'
  BUILD_TARGETS: ${{ inputs.build-targets }}
  CI_NATIVE_MEMORY_MIB: ${{ inputs.native-memory-mib }}
  CI_LAKE_THREADS: ${{ inputs.lake-threads }}
  CI_LINT_WORKERS: ${{ inputs.lint-workers }}

jobs:
  build:
    name: Build
    runs-on: &runner ${{ vars.COLIB_SELF_HOSTED_ENABLED == 'true' && github.repository == 'kangxyz/colib' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && fromJSON(inputs.runner-labels) || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: ${{ inputs.build-job-timeout-minutes || inputs.job-timeout-minutes }}
    outputs:
      local-handoff: ${{ steps.build.outputs.local-handoff }}
      root-cache-key: ${{ steps.restore.outputs.cache-primary-key }}
      root-sha: ${{ steps.build.outputs.root-sha }}
      stacks-sha: ${{ steps.build.outputs.stacks-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: ${{ !inputs.reuse-build-host }}
      - name: Prepare the pinned environment
        id: setup
        run: bash .github/ci/setup.sh
      - name: Restore Colib and checker tools
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.setup.outputs.own_paths }}
          key: ${{ steps.setup.outputs.own_prefix }}-${{ steps.setup.outputs.tools_context }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.setup.outputs.own_prefix }}-${{ steps.setup.outputs.tools_context }}-
            ${{ steps.setup.outputs.own_prefix }}-
      - name: Restore the independent Stacks checkpoint
        id: restore-stacks
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/layered-cache/stacks.tar.zst
          key: colib-layered-v2-stacks-${{ steps.setup.outputs.stacks_context }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: colib-layered-v2-stacks-${{ steps.setup.outputs.stacks_context }}-
      - name: Migrate the earlier Colib root cache
        id: migration
        if: ${{ steps.restore.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/layered-cache/root.tar.zst
          key: colib-layered-v2-root-${{ steps.setup.outputs.root_context }}-migration-${{ github.run_id }}
          restore-keys: colib-layered-v2-root-${{ steps.setup.outputs.root_context }}-
      - name: Build and stage native outputs
        id: build
        working-directory: ${{ inputs.package-directory }}
        env:
          CI_REUSE_HOST: ${{ inputs.reuse-build-host }}
          CI_MIGRATE_ROOT: ${{ steps.migration.outputs.cache-matched-key != '' }}
          CI_BUILD_JOB_MINUTES: ${{ inputs.build-job-timeout-minutes || inputs.job-timeout-minutes }}
          CI_COMPILER_MINUTES: ${{ inputs.build-compiler-minutes }}
        run: bash .github/ci/build.sh
      - name: Preserve completed Colib compilation
        if: ${{ always() && steps.build.outputs.quiescent == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.setup.outputs.own_paths }}
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Preserve completed Stacks compilation
        if: ${{ always() && steps.build.outputs.quiescent == 'true' && steps.build.outputs.stacks-saved == 'true' && (steps.build.outputs.changed == 'true' || steps.restore-stacks.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/layered-cache/stacks.tar.zst
          key: colib-layered-v2-stacks-${{ steps.setup.outputs.stacks_context }}-${{ steps.build.outputs.generation }}
      - name: Transfer Colib outputs to Test
        if: ${{ steps.build.outputs.local-handoff != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-colib
          path: ${{ steps.build.outputs.artifacts }}/colib.tar
          compression-level: 0
          if-no-files-found: error
      - name: Transfer Stacks outputs to Test
        if: ${{ steps.build.outputs.local-handoff != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-stacks
          path: ${{ steps.build.outputs.artifacts }}/stacks.tar.zst
          compression-level: 0
          if-no-files-found: error

  test_lint:
    name: Test, lint and axiom audit
    needs: build
    runs-on: *runner
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.build.outputs.local-handoff != 'true' }}
        with:
          persist-credentials: false
      - name: Prepare the pinned environment
        id: setup
        env:
          CI_LOCAL_HANDOFF: ${{ needs.build.outputs.local-handoff }}
        run: bash .github/ci/setup.sh
      - name: Restore Colib and checker tools
        if: ${{ needs.build.outputs.local-handoff != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.setup.outputs.own_paths }}
          key: ${{ needs.build.outputs.root-cache-key }}-test
          restore-keys: ${{ needs.build.outputs.root-cache-key }}
      - name: Receive this run's native outputs
        if: ${{ needs.build.outputs.local-handoff != 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: build-*
          merge-multiple: true
          path: ${{ runner.temp }}/ci-build
      - name: Verify inputs and run native checks
        id: checks
        working-directory: ${{ inputs.package-directory }}
        env:
          CI_LOCAL_HANDOFF: ${{ needs.build.outputs.local-handoff }}
          CI_ROOT_SHA: ${{ needs.build.outputs.root-sha }}
          CI_STACKS_SHA: ${{ needs.build.outputs.stacks-sha }}
        run: bash .github/ci/test.sh
      - name: Preserve completed Colib and checker compilation
        if: ${{ always() && steps.checks.outputs.quiescent == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.setup.outputs.own_paths }}
          key: ${{ needs.build.outputs.root-cache-key }}-test
      - name: Preserve test-only Stacks compilation
        if: ${{ always() && steps.checks.outputs.quiescent == 'true' && steps.checks.outputs.stacks-saved == 'true' && steps.checks.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/layered-cache/stacks.tar.zst
          key: colib-layered-v2-stacks-${{ steps.setup.outputs.stacks_context }}-${{ steps.checks.outputs.generation }}
      - name: Library export
        if: ${{ steps.checks.outputs.library == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: colib-library
          path: build/library/
      - name: Library website
        if: ${{ steps.checks.outputs.library == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: colib-site
          path: build/site/
      - name: Publishable Colib outputs from the shared host
        if: ${{ needs.build.outputs.local-handoff == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-colib
          path: ${{ steps.checks.outputs.artifacts }}/colib.tar
          include-hidden-files: true
          compression-level: 0
      - name: Publishable Stacks outputs from the shared host
        if: ${{ needs.build.outputs.local-handoff == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-stacks
          path: ${{ steps.checks.outputs.artifacts }}/stacks.tar.zst
          include-hidden-files: true
          compression-level: 0

  upload_cache:
    name: Publish cache
    needs: [build, test_lint]
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: build-*
          merge-multiple: true
      - name: Publish the verified independent caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/publish.sh
