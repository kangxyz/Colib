[entry]
id = "COL-0051"
title = "Rebasing a functor at a specified object"
kind = "definition"
section = "functor-constructions"
order = 10
statement = "A functor and a specified isomorphism from the image of a chosen object to a target object determine a rebased functor, naturally isomorphic to the original, whose chosen object image equals the target. Rebasing by the reflexive isomorphism leaves the functor unchanged."
scope = "Source and target use common object and hom universe parameters. The explicit object replacement and conjugated arrow maps are a separate construction; the cited natural-transformation discussion is background only. No realization homotopy or independence of the specified isomorphism is proved, and this is not identified with path-based change of basepoint. Source correspondence was checked against the cited scope on 2026-11-05; this does not record independent mathematical review or compilation."
review = "author_checked"
