[chapter]
id = "category-theory"
title = "Category theory"
order = 5
introduction = "Categorical foundations retain their chosen objects, universal properties and admissible maps. Exact structures supply the conflations used by algebraic K-theory without requiring an ambient abelian category."

[[sections]]
id = "exact-categories"
title = "Exact categories"
order = 10
introduction = "A chosen class of kernel-cokernel pairs determines an exact structure. Its admissible maps satisfy the Quillen axioms and the mixed pullback theorem. Abelian categories provide the canonical example using all short exact sequences. Additive Serre localization functors preserve these canonical conflations. Matrix rows extend admissible epimorphisms, and exact functors preserve pullbacks along admissible epimorphisms."

[[sections]]
id = "bicategories"
title = "Bicategories"
order = 20
introduction = "Passing from a bicategory to isomorphism classes of its 1-morphisms gives an ordinary category. The quotient retains the original objects and only identifies arrows joined by invertible 2-morphisms."

[[sections]]
id = "restricted-spans"
title = "Restricted spans"
order = 30
introduction = "Restricted spans compose by mixed pullbacks and become ordinary morphisms after quotienting by apex isomorphisms. Admissible epimorphisms on the left and admissible monomorphisms on the right recover the shape of Quillen's Q-construction once an exact-category adapter supplies the hypotheses."

[[sections]]
id = "functor-constructions"
title = "Functor constructions"
order = 40
introduction = "Specified object isomorphisms can replace selected functor values while retaining an explicit natural-isomorphism comparison."
