[chapter]
id = "k-theory"
title = "K-theory"
order = 10
introduction = "We develop additive invariants and the comparison maps used by algebraic K-theory. The current sections construct Grothendieck groups and Milnor K-theory using the selected Mathlib and Stacks objects. Quillen and Waldhausen constructions enter through their own exact and homotopical prerequisites."

[[sections]]
id = "grothendieck-groups"
title = "Grothendieck groups"
order = 10
introduction = "Begin with the presentation by objects and short exact sequences. Its additivity and functoriality lead to the dimension computation for finite-dimensional vector spaces. The object classes and their normalization are retained throughout. Exact-functor maps and the inclusion-image comparison lead to algebraic localization by a Serre class, including the actual canonical quotient."

[[sections]]
id = "milnor-k-theory"
title = "Milnor K-theory"
order = 20
introduction = "The canonical graded object is the Steinberg quotient of the tensor algebra on the multiplicative group of a field. We first construct its homogeneous groups, then compare the degree-two component with the ordered-pair presentation. Ordered tuple symbols then expose coordinate additivity and adjacent Steinberg and sign identities directly on those homogeneous groups. Direct split evaluation and native reduced representatives give finite signed mixed-symbol expansions in the same homogeneous group. Finite witnesses precede all coefficient fields and actual factors; over a perfect base, a prime-degree root-field class then acquires its expansion in the root field of the whole coefficient image after one actual finite coprime extension. Native weak degree bounds and the shifted former strict bounds remain distinct. The literature references identify the defining relations and the scope of each comparison. Canonical DVR residues extend to actual completion through the native fraction-field lift and residue-field identification, preserving and reflecting residue vanishing."

[[sections]]
id = "quillen-k-theory"
title = "Quillen K-theory"
order = 30
introduction = "Quillen K-groups are the shifted homotopy groups of the realized Q-category, based at the original zero vertex. The Q-classifying space BQ is distinguished from its loop space. The objectwise-finite Resolution theorem retains the canonical inclusion map in every degree. The canonical Grothendieck-to-Quillen K-zero map is a proved equivalence on the same actual homotopical K-zero. Classical devissage proves the actual inclusion equivalence from objectwise finite filtrations without extension closure. Quillen-Waldhausen comparisons remain separate results."

[[sections]]
id = "waldhausen-k-theory"
title = "Waldhausen K-theory"
order = 40
introduction = "The current model realizes the unnormalized diagonal IsZero S-construction. Actual weak-row nerves and coherent weak-transformation cylinders retain its maps. Image-zero homotopy-group maps precede explicit based maps; ordinary subdivision and the based three-stage deformation prove additivity for the original canonical KMap. The actual product comparison identifies this with the original group multiplication, which is commutative even in K-zero. A strict chosen-zero model comparison and broader structural comparison theorems remain separate obligations."
