name: Colib CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner-profile:
        description: Runner profile (EC2 also requires COLIB_SELF_HOSTED_ENABLED)
        type: choice
        options: [hosted, ec2]
        default: hosted

permissions:
  contents: read

concurrency:
  group: Colib CI-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lean:
    permissions:
      contents: write
    uses: ./.github/workflows/lean-ci.yml
    with:
      package-directory: .
      build-targets: Colib
      # PRs and non-main revisions always use GitHub-hosted runners.
      ec2: ${{ vars.COLIB_SELF_HOSTED_ENABLED == 'true' && github.repository == 'kangxyz/colib' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.runner-profile == 'ec2')) }}
