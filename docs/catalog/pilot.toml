[[entries]]
id = "COL-0001"
title = "Grothendieck group of an abelian category"
topic = "Grothendieck groups"
statement = "Objects generate an abelian group with one additivity relation for each short exact sequence."
declarations = ["CategoryTheory.GrothendieckGroup"]
reference = "stacks"
locator = "Tag 02MU, Definition 12.11.1"
url = "https://stacks.math.columbia.edu/tag/02MU"
relation = "generalization"
scope = "The implementation is defined for categories with zero morphisms. The source's abelian case is included."
review = "author_checked"

[[entries]]
id = "COL-0002"
title = "Additivity on short exact sequences"
topic = "Grothendieck groups"
statement = "For a short exact sequence A to B to C, the class of B equals the sum of the classes of A and C."
declarations = ["CategoryTheory.GrothendieckGroup.additivity"]
reference = "stacks"
locator = "Tag 02MU, defining relation"
url = "https://stacks.math.columbia.edu/tag/02MU"
relation = "clause"
scope = "The relation clause of the definition."
review = "author_checked"

[[entries]]
id = "COL-0003"
title = "Functoriality of the Grothendieck group"
topic = "Grothendieck groups"
statement = "A zero-preserving functor carrying short exact sequences to short exact sequences induces the map on object classes."
declarations = ["CategoryTheory.GrothendieckGroup.map", "CategoryTheory.GrothendieckGroup.map_of"]
reference = "stacks"
