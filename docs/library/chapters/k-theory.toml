[chapter]
id = "k-theory"
title = "General algebraic K-theory"
order = 10
introduction = "The general theory of exact and Waldhausen categories: Grothendieck presentations, Quillen and Waldhausen K-groups, functoriality, comparison, resolution, devissage, localization and cofinality. These results use the actual categorical objects and canonical maps. Ring, field and scheme specializations have a separate chapter."

[[sections]]
id = "grothendieck-groups"
title = "Grothendieck groups"
order = 10
introduction = "Begin with the presentation by objects and short exact sequences. Additivity, functoriality and the comparison with homotopical K-zero retain the original object classes. Exact-functor maps and the inclusion-image comparison lead to algebraic localization by a Serre class, including the actual canonical quotient. Dimension computations for finite modules over fields belong to the rings-and-schemes chapter."

[[sections]]
id = "quillen-k-theory"
title = "Quillen K-theory"
order = 30
introduction = "Quillen K-groups are the shifted homotopy groups of the realized Q-category, based at the original zero vertex. The Q-classifying space BQ is distinguished from its loop space. The objectwise-finite Resolution theorem retains the canonical inclusion map in every degree. The canonical Grothendieck-to-Quillen K-zero map is a proved equivalence on the same actual homotopical K-zero. Classical devissage proves the actual inclusion equivalence from objectwise finite filtrations without extension closure. Quillen-Waldhausen comparisons remain separate results. Canonical Serre localization identifies the actual quotient homotopy fiber and yields the connective long exact sequence with its original inclusion, quotient and path-space boundary maps. The actual localization target and the original small-model map inherit this sequence through proved categorical and exact-structure comparisons. For finite-support families, every positive Quillen K-group is the direct sum of the coordinate groups through the original evaluation and singleton inclusion maps."

[[sections]]
id = "waldhausen-k-theory"
title = "Waldhausen K-theory"
order = 40
introduction = "The current model realizes the unnormalized diagonal IsZero S-construction. Actual weak-row nerves and coherent weak-transformation cylinders retain its maps. The genuine simplicial composition triangle has those original cylinders as all three faces and fixes its entire zero-vertex triangle under explicit chosen-zero equalities. Image-zero homotopy-group maps precede explicit based maps; ordinary subdivision and the based three-stage deformation prove additivity for the original canonical KMap. The actual product comparison identifies this with the original group multiplication, which is commutative even in K-zero. Actual acyclic subcategories and relative quotient rows now give the fibration theorem for the original canonical path-space comparison under coarse two-out-of-three, extension, joint cylinder data and its second-endpoint section. The full nullhomotopy and distinct universes are retained. Approximation proves weak equivalence of the unchanged delooping and bijectivity of its canonical KMap in every nonnegative degree from exactness, App1/App2, target two-out-of-three and genuine source joint-cylinder data; no row-equivalence or homotopy-inverse premise is added. The actual connective change-of-weak long exact sequence retains its path-space boundary and K-zero tail. For termwise extension- and kernel-closed subcategories of an abelian category, native bounded-complex filtrations and the actual identity-cone cylinder prove Gillet-Waldhausen on the original degree-zero single KMap in every nonnegative degree. Dense cofinality constructs the actual complement grading and compares its coarse delooping with the nerve of its realized-value subgroup. The original full inclusion is an equivalence in positive K-degrees and injective in K-zero; its exact tail retains the actual coarse K-zero group. The original object-loop map now identifies the universal weak-arrow and pushout presentation with actual K-zero, without additional cylinder hypotheses. Under genuine target factorization, its naturality identifies the actual coarse K-zero obstruction with the quotient by the original exact-functor image and retains the unchanged changeWeak KMap. Finite S-iteration uses the native strict chosen-zero subcategory, while arbitrary exact functors use canonical zero rebasing. The actual loop prespectrum has the original K-groups as its zero-space homotopy sets. Whole weak-transformation homotopies and relative composition preserve every structure parameter. In the grading-coarse target, the genuine weak zero endotransformation contracts original normalized self-tracks, and the supplied null-conjugate gives the actual zero-loop homotopy. The genuine added-initial-row contraction and full path-fiber comparison prove that every original iterated-S loop structure map is a weak equivalence, including path components. The resulting connective Omega-spectrum retains the exact-functor maps and original KMap. The actual integer-graded stable groups recover every original K-group, including K-zero and its group law, naturally for the original KMap; all negative groups vanish by proved connectivity. The original canonical acyclic-to-fiber spectrum map is a stable equivalence in every integer degree under the same four structural fibration hypotheses. Its complete nullhomotopy and signed boundary comparison retain the original K-one to K-zero endpoint. Actual S-model connectivity and point HEP prove stable cone-to-fiber excision without an extra excision premise. The original acyclic null track gives the actual coarse-spectrum cone comparison under the same four fibration hypotheses, with its target face, whole cylinder and signed boundary retained. No nonconnective theory is asserted."
